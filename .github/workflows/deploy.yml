name: Deploy

on:
  push:
    branches: [main]

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Gate ─────────────────────────────────────────────────────────────────
  # Deploy used to race CI on the same push event, so a red test suite still
  # shipped. Everything below now waits on these checks.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ─── Build + Push Docker to Lightsail ─────────────────────────────────────
  build-and-deploy-backend:
    name: Build Docker Image → Lightsail
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install lightsailctl plugin
        run: |
          curl -sL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build --platform linux/amd64 \
            -t cancards-backend:${{ github.sha }} \
            -t cancards-backend:latest \
            .

      - name: Push image to Lightsail
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE_NAME }}
        run: |
          aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "$SERVICE_NAME" \
            --label app \
            --image cancards-backend:latest \
            2>&1 | tee /tmp/push_output.txt

          # Extract the image reference from the output
          IMAGE_REF=$(grep "Refer to this image as" /tmp/push_output.txt | grep -o '":[^"]*"' | tr -d '"')
          echo "IMAGE_REF=$IMAGE_REF" >> $GITHUB_ENV
          echo "Pushed image reference: $IMAGE_REF"

      - name: Deploy to Lightsail
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE_NAME }}
        run: |
          aws lightsail create-container-service-deployment \
            --region "$AWS_REGION" \
            --service-name "$SERVICE_NAME" \
            --containers "{
              \"app\": {
                \"image\": \"$IMAGE_REF\",
                \"ports\": {\"8000\": \"HTTP\"},
                \"environment\": {
                  \"OPENAI_API_KEY\": \"${{ secrets.OPENAI_API_KEY }}\",
                  \"ANTHROPIC_API_KEY\": \"${{ secrets.ANTHROPIC_API_KEY }}\",
                  \"PINECONE_API_KEY\": \"${{ secrets.PINECONE_API_KEY }}\",
                  \"PINECONE_INDEX_NAME\": \"cancards-index\",
                  \"PINECONE_CLOUD\": \"aws\",
                  \"PINECONE_REGION\": \"us-east-1\",
                  \"EMBEDDING_MODEL\": \"text-embedding-3-small\",
                  \"LLM_MODEL\": \"claude-sonnet-4-6\",
                  \"LLM_PROVIDER\": \"anthropic\",
                  \"LANGSMITH_API_KEY\": \"${{ secrets.LANGSMITH_API_KEY }}\",
                  \"LANGSMITH_PROJECT\": \"cancards-ai\",
                  \"LANGSMITH_TRACING\": \"true\",
                  \"APP_ENV\": \"production\",
                  \"LOG_LEVEL\": \"INFO\",
                  \"ALLOWED_ORIGINS\": \"https://cancards-ai.vercel.app\"
                }
              }
            }" \
            --public-endpoint "{
              \"containerName\": \"app\",
              \"containerPort\": 8000,
              \"healthCheck\": {\"path\": \"/health\"}
            }"

          echo "Lightsail deployment triggered for commit ${{ github.sha }}"

      # create-container-service-deployment returns as soon as the request is
      # accepted. Without this wait the frontend can go live against the
      # previous backend build for the length of the rollout.
      - name: Wait for Lightsail deployment to become ACTIVE
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE_NAME }}
        run: |
          for attempt in $(seq 1 60); do
            STATE=$(aws lightsail get-container-services \
              --region "$AWS_REGION" \
              --service-name "$SERVICE_NAME" \
              --query 'containerServices[0].currentDeployment.state' \
              --output text)
            echo "[$attempt/60] deployment state: $STATE"

            case "$STATE" in
              ACTIVE)
                echo "Deployment is live."
                exit 0
                ;;
              FAILED|INACTIVE)
                echo "::error::Lightsail deployment finished in state $STATE"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::Timed out after 15 minutes waiting for the deployment to become ACTIVE"
          exit 1

  # ─── Deploy Frontend to Vercel ────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend   # Backend is live before the frontend points at it

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
