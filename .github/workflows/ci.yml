name: CI

on:
  pull_request:
    branches: [main]
  # Callable so deploy.yml can gate on these checks instead of racing them.
  # No push trigger — deploy.yml calls this on every push to main, and having
  # both would run the whole suite twice per merge.
  workflow_call:

jobs:
  # ─── Backend Lint ──────────────────────────────────────────────────────────
  lint-backend:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check app/ tests/ ../tests/

      - name: Format check with ruff
        run: uv run ruff format --check app/ tests/ ../tests/

  # ─── Dependency Drift ──────────────────────────────────────────────────────
  # The Docker image installs from requirements.txt while CI installs from
  # uv.lock. They drifted once already — two Pinecone distributions shipped to
  # production. requirements.txt is a projection of the lockfile; this fails the
  # build when it stops being one.
  #
  # Exported from uv.lock rather than recompiled from pyproject.toml on purpose:
  # a recompile re-resolves against the index, so any upstream release would
  # turn this red on a PR that changed nothing.
  deps-in-sync:
    name: Backend Deps (requirements.txt in sync)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Export from lockfile and diff
        run: |
          uv export --format requirements-txt --no-dev --no-hashes --no-emit-project \
            > /tmp/requirements.expected
          if ! diff -u requirements.txt /tmp/requirements.expected; then
            echo "::error::requirements.txt is out of sync with uv.lock. Run:"
            echo "::error::  cd backend && uv export --format requirements-txt --no-dev \\"
            echo "::error::    --no-hashes --no-emit-project > requirements.txt"
            exit 1
          fi

  # ─── Backend Type Check ────────────────────────────────────────────────────
  typecheck-backend:
    name: Backend Types (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Type check with mypy
        run: uv run mypy app/ --ignore-missing-imports --no-strict-optional

  # ─── Backend Unit Tests ────────────────────────────────────────────────────
  test-backend:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          # Dummy values — unit tests mock all external calls
          OPENAI_API_KEY: sk-test
          ANTHROPIC_API_KEY: sk-test
          PINECONE_API_KEY: test
          LANGSMITH_API_KEY: test

      # The 18 multi-turn coach conversations, played through the real graph against
      # recorded Claude replies: no network, no cost. Fails the build if premature advice,
      # repeated questions, completion, extraction or score accuracy fall past the floors
      # in tests/evals/coach_thresholds.json. It catches logic regressions, and a changed
      # prompt fails it until the recording is refreshed; it cannot see model drift.
      - name: Coach scenario gate (replayed)
        run: uv run python ../tests/evals/run_coach_scenarios.py --replay
        env:
          OPENAI_API_KEY: sk-test
          ANTHROPIC_API_KEY: sk-test
          PINECONE_API_KEY: test
          LANGSMITH_API_KEY: test

  # ─── Frontend Type Check ───────────────────────────────────────────────────
  typecheck-frontend:
    name: Frontend Types (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── Frontend Lint ─────────────────────────────────────────────────────────
  lint-frontend:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --ext is a no-op under flat config — the config's own globs decide scope.
      - name: ESLint
        run: npx eslint src/ --max-warnings 0
